name: carry_go
description: CarryGo connects Nigerian customers with verified bike riders for errands and parcel delivery.

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  firebase_core: ^4.11.0
  firebase_auth: ^6.5.4
  cloud_firestore: ^6.6.0
  google_maps_flutter: ^2.14.2
  geolocator: ^14.0.2
  http: ^1.6.0
  provider: ^6.0.0
  firebase_storage: ^13.4.3
  firebase_messaging: ^16.4.1
  image_picker: ^1.2.1
  url_launcher: ^6.3.2
  file_picker: ^11.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/carrygo_logo.png
