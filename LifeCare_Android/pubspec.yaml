name: lifecare_connect
description: A mobile app for CHWs and healthcare providers to manage patients.
version: 2.0.11+75
publish_to: "none"

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ✅ Firebase Core Services
  firebase_core: ^4.1.1
  firebase_auth: ^6.1.0
  firebase_app_check: ^0.4.1
  cloud_firestore: ^6.0.2
  cloud_functions: ^6.0.2
  firebase_storage: ^13.0.2
  firebase_messaging: ^16.0.2

  # ✅ Social Authentication
  google_sign_in: ^7.1.1

  # ✅ Utilities
  shared_preferences: ^2.2.2
  file_picker: ^10.2.3
  excel: ^4.0.6
  http: ^1.5.0
  flutter_local_notifications: ^19.4.0
  timezone: ^0.10.1
  printing: ^5.14.2
  flutter_native_splash: ^2.4.0
  flutter_launcher_icons: ^0.14.4
  provider: ^6.1.2
  crypto: ^3.0.3
  rxdart: ^0.28.0
  
  # ✅ Offline-first database
  sqflite: ^2.3.0
  sqflite_common_ffi_web: ^0.4.0+1
  drift: ^2.14.1
  sqlite3_flutter_libs: ^0.5.0

  # Routing and date formatting
  go_router: ^16.1.0
  intl: ^0.20.2

  # Media and device integration
  image_picker: ^1.1.1
  url_launcher: ^6.2.6
  path_provider: ^2.1.3
  connectivity_plus: ^7.0.0
  syncfusion_flutter_pdfviewer: ^31.1.19
  flutter_pdfview: ^1.2.5
  video_player: ^2.8.6
  table_calendar: ^3.1.1
  open_file: ^3.3.2
  cached_network_image: ^3.3.1

  # ✅ Payments

  # ✅ Real-time Communication
  agora_rtc_engine: ^6.5.3
  stripe_sdk: ^5.0.0
  flutter_dotenv: ^6.0.0
  pdf: ^3.11.3
  permission_handler: ^12.0.1
  path: any
  
  # ✅ Sharing and QR Code
  qr_flutter: ^4.1.0
  share_plus: ^10.0.3
  
  # ✅ Markdown rendering
  flutter_markdown: ^0.7.4+1
  web: ^1.1.1
  
  flutter_web_plugins:
    sdk: flutter

dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/
    - .env

  fonts:
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-Regular.ttf
        - asset: assets/fonts/OpenSans-Bold.ttf
          weight: 700
