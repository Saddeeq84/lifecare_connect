<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LifeCare Video Call</title>
  <script src="https://download.agora.io/sdk/release/AgoraRTC_N.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: linear-gradient(135deg, #e0e7ff 0%, #f4f4f4 100%);
      margin: 0;
      min-height: 100vh;
    }
    .dialog-backdrop {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; z-index: 1000;
    }
    .dialog {
      background: #fff; border-radius: 12px; box-shadow: 0 4px 24px #0002; padding: 32px 40px; text-align: center; max-width: 90vw;
    }
    .dialog h2 { margin-top: 0; color: #2d3a5a; }
    .dialog button { background: #2563eb; color: #fff; border: none; border-radius: 6px; padding: 12px 32px; font-size: 1.1em; cursor: pointer; margin-top: 24px; }
    .dialog button:hover { background: #1e40af; }
    .header {
      background: #2563eb; color: #fff; padding: 24px 0 16px 0; text-align: center; box-shadow: 0 2px 8px #0001;
    }
    .header h1 { margin: 0; font-size: 2.2em; letter-spacing: 1px; }
    #video-container {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 24px;
      margin: 40px auto 0 auto; max-width: 1100px; min-height: 320px;
    }
    .video-box { background: #111; border-radius: 10px; overflow: hidden; position: relative; }
    .video-label {
      position: absolute; left: 0; bottom: 0; background: #2563ebcc; color: #fff; padding: 2px 10px; font-size: 0.95em; border-radius: 0 8px 0 0;
    }
    video { width: 100%; height: 320px; background: #000; display: block; }
    #controls { margin: 32px auto 0 auto; text-align: center; }
    .btn {
      padding: 12px 32px; margin: 0 8px; font-size: 1.1em; border-radius: 6px; border: none; background: #2563eb; color: #fff; cursor: pointer; transition: background 0.2s;
    }
    .btn:hover { background: #1e40af; }
    .btn.muted { background: #dc2626; }
    .btn.muted:hover { background: #b91c1c; }
    .btn.end-call { background: #dc2626; }
    .btn.end-call:hover { background: #b91c1c; }
    
    .call-info {
      margin: 20px auto; text-align: center; font-size: 1.1em;
    }
    .call-timer {
      background: #1e293b; color: #fff; padding: 8px 16px; border-radius: 20px; 
      display: inline-block; font-weight: bold; font-family: 'Courier New', monospace;
      margin-bottom: 16px;
    }
    .controls-row {
      display: flex; justify-content: center; align-items: center; flex-wrap: wrap; gap: 8px;
    }
    
    @media (max-width: 700px) {
      #video-container { grid-template-columns: 1fr; }
      .header h1 { font-size: 1.3em; }
      .controls-row { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>LifeCare Video/Audio Call</h1>
    <p style="margin: 8px 0 0 0; font-size:1.1em; color:#e0e7ff;">Secure, high-quality video calls for your consultation</p>
  </div>
  <div id="controls" style="display:none;">
    <div class="call-info">
      <div class="call-timer" id="call-timer">00:00:00</div>
    </div>
    <div class="controls-row">
      <button class="btn" id="mute-btn" onclick="toggleMicrophone()">🎤 Mute</button>
      <button class="btn" id="camera-btn" onclick="toggleCamera()" style="display:none;">📹 Camera Off</button>
      <button class="btn end-call" onclick="endCall()">📞 End Call</button>
      <button class="btn" onclick="leaveCall()">🚪 Leave Call</button>
    </div>
  </div>
  <div id="video-container"></div>
  <div id="entry-dialog" class="dialog-backdrop">
    <div class="dialog">
      <h2>Ready to join your consultation?</h2>
      <p>Click continue to proceed to the secure video/audio call. Your privacy is protected.</p>
  <button onclick="proceedToCall()">Continue</button>
  <button onclick="cancelCall()" style="background:#e11d48; margin-left:16px;">Cancel</button>
    </div>
  </div>
  <script>

    // Agora App ID (keep this public)
    const APP_ID = 'a105462abb1746fc9075e6c2f81f5ac5';
    let TOKEN = null;
    let CHANNEL = null;
    let UID = null;
    let client, localTracks = [], joined = false;
    let remoteUsers = {};
    
    // Call timer and microphone/camera state
    let callStartTime = null;
    let callTimer = null;
    let isMuted = false;
    let isVideoEnabled = true;
    let isVideoCall = true; // Will be determined from URL params
    const MAX_CALL_DURATION = 60 * 60 * 1000; // 1 hour in milliseconds

    // Helper to get URL query params
    function getQueryParam(name) {
      const url = new URL(window.location.href);
      return url.searchParams.get(name);
    }

    // Call timer functions
    function startCallTimer() {
      callStartTime = Date.now();
      callTimer = setInterval(updateCallTimer, 1000);
    }

    function updateCallTimer() {
      if (!callStartTime) return;
      
      const elapsed = Date.now() - callStartTime;
      const hours = Math.floor(elapsed / (1000 * 60 * 60));
      const minutes = Math.floor((elapsed % (1000 * 60 * 60)) / (1000 * 60));
      const seconds = Math.floor((elapsed % (1000 * 60)) / 1000);

      const timeString = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
      document.getElementById('call-timer').textContent = timeString;

      // Auto-end call after 1 hour
      if (elapsed >= MAX_CALL_DURATION) {
        alert('Call duration limit (1 hour) reached. Ending call.');
        leaveCall();
      }
    }

    function stopCallTimer() {
      if (callTimer) {
        clearInterval(callTimer);
        callTimer = null;
        callStartTime = null;
      }
      document.getElementById('call-timer').textContent = '00:00:00';
    }

    // Microphone toggle function
    async function toggleMicrophone() {
      if (!localTracks[0]) return;

      try {
        const muteBtn = document.getElementById('mute-btn');
        if (isMuted) {
          await localTracks[0].setEnabled(true);
          muteBtn.textContent = '🎤 Mute';
          muteBtn.classList.remove('muted');
          isMuted = false;
        } else {
          await localTracks[0].setEnabled(false);
          muteBtn.textContent = '🔇 Unmute';
          muteBtn.classList.add('muted');
          isMuted = true;
        }
      } catch (error) {
        console.error('Error toggling microphone:', error);
        alert('Failed to toggle microphone. Please try again.');
      }
    }

    // Camera toggle function (only for video calls)
    async function toggleCamera() {
      if (!isVideoCall || !localTracks[1]) return;

      try {
        const cameraBtn = document.getElementById('camera-btn');
        if (isVideoEnabled) {
          // Turn off camera
          await localTracks[1].setEnabled(false);
          cameraBtn.textContent = '📹 Camera On';
          cameraBtn.classList.add('muted');
          isVideoEnabled = false;
          
          // Show audio icon in local video box
          const localVideoBox = document.getElementById('video-local');
          if (localVideoBox) {
            localVideoBox.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100%;font-size:80px;">📹</div>';
          }
        } else {
          // Turn on camera
          await localTracks[1].setEnabled(true);
          cameraBtn.textContent = '📹 Camera Off';
          cameraBtn.classList.remove('muted');
          isVideoEnabled = true;
          
          // Restore video display
          localTracks[1].play('video-local');
        }
      } catch (error) {
        console.error('Error toggling camera:', error);
        alert('Failed to toggle camera. Please try again.');
      }
    }

    async function proceedToCall() {
      try {
        document.getElementById('entry-dialog').style.display = 'none';
        document.getElementById('controls').style.display = 'block';
        await joinCall();
      } catch (error) {
        console.error('Error proceeding to call:', error);
        alert('Failed to start call: ' + error.message);
        // Show dialog again on error
        document.getElementById('entry-dialog').style.display = 'flex';
        document.getElementById('controls').style.display = 'none';
      }
    }

    function cancelCall() {
      // Try to close the tab/window if possible, otherwise go back or to home
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.close();
        // If window.close() fails (most browsers), redirect to home
        setTimeout(function() {
          window.location.href = '/';
        }, 300);
      }
    }

    async function joinCall() {
      // Get channelName and uid from URL, fallback to defaults if missing
      CHANNEL = getQueryParam('channelName') || 'test_lifecare';
      UID = getQueryParam('uid') || null;
      
      // Determine if this is a video call or audio-only call
      const callType = getQueryParam('type') || 'video'; // 'video' or 'audio'
      isVideoCall = callType === 'video';
      isVideoEnabled = isVideoCall;
      
      // Show/hide camera button based on call type
      const cameraBtn = document.getElementById('camera-btn');
      if (isVideoCall) {
        cameraBtn.style.display = 'inline-block';
      } else {
        cameraBtn.style.display = 'none';
      }
      
      // Update header text based on call type
      const header = document.querySelector('.header h1');
      header.textContent = isVideoCall ? 'LifeCare Video Call' : 'LifeCare Audio Call';
      
      // Ensure UID is always a valid number and not null/undefined
      if (UID) {
        UID = parseInt(UID, 10);
        if (isNaN(UID)) UID = null;
      }
      // If UID is not provided or invalid, generate a random integer UID
      if (!UID) {
        UID = Math.floor(Math.random() * 1000000) + 1; // Agora UID must be > 0
      }

      // Fetch token from Firebase-hosted token server
      try {
        const tokenUrl = `/agora-token?channelName=${encodeURIComponent(CHANNEL)}${UID ? `&uid=${encodeURIComponent(UID)}` : ''}`;
        const resp = await fetch(tokenUrl);
        if (!resp.ok) throw new Error('Failed to fetch token');
        const data = await resp.json();
        TOKEN = data.token;
        if (!TOKEN) throw new Error('No token received');
      } catch (err) {
        alert('Failed to get Agora token. Please try again later.');
        window.location.href = '/';
        return;
      }

      // Check if AgoraRTC is available
      if (typeof AgoraRTC === 'undefined') {
        throw new Error('Agora SDK not loaded. Please refresh the page and try again.');
      }
      
      client = AgoraRTC.createClient({ mode: 'rtc', codec: 'vp8' });
      client.on('user-published', handleUserPublished);
      client.on('user-unpublished', handleUserUnpublished);
      // Token renewal: listen for token-privilege-will-expire and token-privilege-did-expire
      client.on('token-privilege-will-expire', async function () {
        try {
          const tokenUrl = `/agora-token?channelName=${encodeURIComponent(CHANNEL)}${UID ? `&uid=${encodeURIComponent(UID)}` : ''}`;
          const resp = await fetch(tokenUrl);
          if (!resp.ok) throw new Error('Failed to fetch token');
          const data = await resp.json();
          const newToken = data.token;
          if (!newToken) throw new Error('No token received');
          await client.renewToken(newToken);
          TOKEN = newToken;
          console.log('Agora token renewed successfully');
        } catch (err) {
          alert('Failed to renew Agora token. Please rejoin the call.');
        }
      });
      client.on('token-privilege-did-expire', function () {
        alert('Agora token expired. Please rejoin the call.');
      });
      try {
        await client.join(APP_ID, CHANNEL, TOKEN, UID);
        console.log('Successfully joined channel:', CHANNEL);
        
        // Create tracks based on call type
        if (isVideoCall) {
          console.log('Creating video and audio tracks...');
          localTracks = await AgoraRTC.createMicrophoneAndCameraTracks();
          console.log('Tracks created:', localTracks);
          addVideoBox('local', 'You');
          console.log('Playing video track on video-local element...');
          localTracks[1].play('video-local'); // video track
          console.log('Publishing tracks...');
          await client.publish(localTracks);
          console.log('Tracks published successfully');
        } else {
          // Audio-only call
          console.log('Creating audio track only...');
          const audioTrack = await AgoraRTC.createMicrophoneAudioTrack();
          localTracks = [audioTrack];
          addAudioBox('local', 'You');
          console.log('Publishing audio track...');
          await client.publish([audioTrack]);
          console.log('Audio track published successfully');
        }
        
        joined = true;
        
        // Start call timer
        startCallTimer();
      } catch (error) {
        console.error('Error during call setup:', error);
        alert('Failed to start call: ' + error.message + '. Please check your microphone/camera permissions and try again.');
      }
    }

    function addVideoBox(uid, label) {
      let box = document.getElementById('video-box-' + uid);
      if (!box) {
        box = document.createElement('div');
        box.className = 'video-box';
        box.id = 'video-box-' + uid;
        let video = document.createElement('div');
        video.id = 'video-' + uid;
        box.appendChild(video);
        let tag = document.createElement('div');
        tag.className = 'video-label';
        tag.innerText = label;
        box.appendChild(tag);
        document.getElementById('video-container').appendChild(box);
      }
    }

    function addAudioBox(uid, label) {
      let box = document.getElementById('audio-' + uid);
      if (!box) {
        box = document.createElement('div');
        box.className = 'video-box'; // Reuse video-box styling
        box.id = 'audio-' + uid;
        box.style.display = 'flex';
        box.style.alignItems = 'center';
        box.style.justifyContent = 'center';
        box.style.flexDirection = 'column';
        
        // Add audio icon
        let audioIcon = document.createElement('div');
        audioIcon.style.fontSize = '80px';
        audioIcon.textContent = '🎤';
        box.appendChild(audioIcon);
        
        // Add label
        let tag = document.createElement('div');
        tag.className = 'video-label';
        tag.innerText = label;
        box.appendChild(tag);
        
        document.getElementById('video-container').appendChild(box);
      }
    }

    async function handleUserPublished(user, mediaType) {
      await client.subscribe(user, mediaType);
      if (mediaType === 'video') {
        addVideoBox(user.uid, 'Participant');
        user.videoTrack.play('video-' + user.uid);
      }
      if (mediaType === 'audio') {
        user.audioTrack.play();
        // For audio-only calls, show audio box if video box doesn't exist
        if (!isVideoCall && !document.getElementById('video-box-' + user.uid)) {
          addAudioBox(user.uid, 'Participant');
        }
      }
      remoteUsers[user.uid] = user;
    }

    function handleUserUnpublished(user) {
      delete remoteUsers[user.uid];
      let videoBox = document.getElementById('video-box-' + user.uid);
      let audioBox = document.getElementById('audio-' + user.uid);
      if (videoBox) videoBox.remove();
      if (audioBox) audioBox.remove();
    }

    async function leaveCall() {
      if (!joined) return;
      
      // Stop call timer
      stopCallTimer();
      
      // Clean up tracks and leave
      for (let track of localTracks) {
        track.close();
      }
      await client.leave();
      document.getElementById('video-container').innerHTML = '';
      document.getElementById('controls').style.display = 'none';
      joined = false;
      
      // Reset microphone and camera state
      isMuted = false;
      const muteBtn = document.getElementById('mute-btn');
      muteBtn.textContent = '🎤 Mute';
      muteBtn.classList.remove('muted');
      
      if (isVideoCall) {
        isVideoEnabled = true;
        const cameraBtn = document.getElementById('camera-btn');
        cameraBtn.textContent = '📹 Camera Off';
        cameraBtn.classList.remove('muted');
      }
      
      // Optionally, show dialog again or redirect
      document.getElementById('entry-dialog').style.display = 'flex';
    }

    async function endCall() {
      if (!joined) {
        // If not in call, just close the window
        closeCallWindow();
        return;
      }

      // Confirm ending the call
      const confirmEnd = confirm('Are you sure you want to end the call? This will close the call window.');
      if (!confirmEnd) return;
      
      // Stop call timer
      stopCallTimer();
      
      // Clean up tracks and leave
      for (let track of localTracks) {
        track.close();
      }
      await client.leave();
      joined = false;
      
      // Close the window/tab or redirect to home
      closeCallWindow();
    }

    function closeCallWindow() {
      // Try to close the tab/window if possible, otherwise go back or to home
      if (window.history.length > 1) {
        window.history.back();
      } else {
        window.close();
        // If window.close() fails (most browsers), redirect to home
        setTimeout(function() {
          window.location.href = '/';
        }, 300);
      }
    }
  </script>
</body>
</html>
